trigger: none

variables:
  AZ_SERVICE_CONNECTION: boldreports-self-host-buildx-testing
  ARM_RG: boldbi-test
  ARM_VMSS: boldreports-arm64-buildx-vmss
  ARM_IMAGE_ID: /subscriptions/b7ba5c62-bc85-451a-a00e-0a9ceddf48c3/resourceGroups/boldbi-test/providers/Microsoft.Compute/galleries/boldreports_ga/images/boldreports_buildx_arm64/versions/0.0.1
  ARM_VM_SIZE: Standard_D2ps_v6
  ARM_VNET: buildx-vnet
  ARM_SUBNET: buildx-sub
  ARM_VM_NAME: boldreports-arm-$(Build.BuildId)
  BUILDER_NAME: boldreports-k8s-builder-$(Build.BuildId)
  CLOUD_BUILDER_ENDPOINT: syncfusion/boldbi-cloud  # TODO: confirm the real Docker Build Cloud builder name
  ARM_ADMIN_PASSWORD: Admin@123123

parameters:
  - name: imageTag
    displayName: Docker Image Tag
    type: string
    default: latest
  - name: linux_package
    displayName: 'Docker Linux Package URL'
    type: string
    default: ''
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - production
  - name: buildType
    displayName: Build Type
    type: string
    default: selfhost
    values:
      - cloud
      - selfhost
  - name: utility_branch_name
    displayName: 'Utility Branch Name'
    type: string
    default: 'development'
  - name: docker_files_version
    displayName: 'Docker files version'
    type: string
    default: 'latest'
  - name: All
    displayName: Build All Images
    type: boolean
    default: false
  - name: ID_WEB
    displayName: Build IDP Web (bold-identity)
    type: boolean
    default: false
  - name: ID_API
    displayName: Build IDP API (bold-idp-api)
    type: boolean
    default: false
  - name: ID_UMS
    displayName: Build IDP UMS (bold-ums)
    type: boolean
    default: false
  - name: Reports_WEB
    displayName: Build Reports Server (Web)
    type: boolean
    default: false
  - name: Reports_API
    displayName: Build Reports Server API
    type: boolean
    default: false
  - name: Reports_JOBS
    displayName: Build Reports Jobs
    type: boolean
    default: false
  - name: Reports_REPORTSERVCE
    displayName: Build Reports Designer
    type: boolean
    default: false
  - name: Reports_VIEWER
    displayName: Build Reports Viewer
    type: boolean
    default: false
  - name: BOLD_ETL
    displayName: Build BOLD ETL
    type: boolean
    default: false
  - name: Reports_AI
    displayName: Build Reports AI
    type: boolean
    default: false
  - name: Reports_MCP
    displayName: Build Reports MCP
    type: boolean
    default: false

stages:
- stage: Build
  jobs:
  - job: DockerBuild
    displayName: Build Docker Images
    timeoutInMinutes: 240
    workspace:
      clean: all
    pool:
      name: boldreports-buildx-amd64-vmss-agent-pool
    steps:
    - checkout: none

    - bash: |
        TAG="${{ parameters.imageTag }}"
        if [[ ! "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
          echo "Invalid Docker image tag: $TAG"
          exit 1
        fi
        echo "Image tag validation successful"
      displayName: Validate image tag

    - bash: |
        if [ "${{ parameters.environment }}" = "dev" ]; then
          REPO="syncfusion/dev-bold"
        else
          REPO="syncfusion/bold"
        fi
        echo "##vso[task.setvariable variable=REPOSITORY]$REPO"
      displayName: Set Docker Repository

    #################################################
    # Create this run's ARM64 VM (selfhost only)
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Create ARM64 VM
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eo pipefail
            ARGS=(
              --resource-group "$(ARM_RG)"
              --location eastus
              --name "$(ARM_VM_NAME)"
              --image "$(ARM_IMAGE_ID)"
              --size "$(ARM_VM_SIZE)"
              --security-type TrustedLaunch
              --enable-secure-boot true
              --enable-vtpm true
              --vnet-name "$(ARM_VNET)"
              --subnet "$(ARM_SUBNET)"
              --nsg ""
              --public-ip-address ""
              --admin-username azureuser
              --authentication-type password
              --admin-password "$ARM_ADMIN_PASSWORD"
              --nic-delete-option Delete
              --os-disk-delete-option Delete
              --tags pipelineBuildId=$(Build.BuildId) createdBy=azdo-buildx
            )
            az vm create "${ARGS[@]}"
            ARM64_IP=$(az vm show -d -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --query privateIps -o tsv)
            if [ -z "$ARM64_IP" ]; then
              echo "ARM64 IP not found"
              exit 1
            fi
            echo "ARM64 VM: $(ARM_VM_NAME)  IP: $ARM64_IP"
            echo "##vso[task.setvariable variable=arm64_vm_private_ip]$ARM64_IP"
        env:
          ARM_ADMIN_PASSWORD: $(ARM_ADMIN_PASSWORD)

    #################################################
    # Docker login (same for cloud and selfhost)
    #################################################
    - bash: |
        echo "$(DOCKER_PASSWORD)" | docker login \
          --username syncfusion \
          --password-stdin
      displayName: Docker Login

    #################################################
    # Download package & clone utilities
    #################################################
    - task: Syncfusion Gitea Checkout@1
      inputs:
        giteaUrl: 'https://gitea.syncfusion.com/bold-reports/bold-reports-utilities'
        branch: '${{ parameters.utility_branch_name }}'
      displayName: 'Checkout bold-reports-utilities'

    - script: |
        mkdir -p bold-reports-utilities
        shopt -s dotglob extglob
        mv !(bold-reports-utilities) bold-reports-utilities/
      displayName: 'Move files to bold-reports-utilities'

    - bash: |
        cd "$(Build.SourcesDirectory)"
        wget '${{ parameters.linux_package }}'
        sudo apt-get install -y unzip
        sudo unzip BoldReports*.zip
        ls
        rm BoldReports*.zip
      displayName: 'Download & Unzip Linux Package'

    - bash: |
        echo "======================================================"
        echo "STEP 1 : Detecting Bold Reports Package"
        echo "======================================================"
        ROOT_DIR="$(System.DefaultWorkingDirectory)"
        if [ -d "$ROOT_DIR/BoldReportsServer-Linux" ]; then
            TARGET_DIR="$ROOT_DIR/BoldReportsServer-Linux"
            echo "##vso[task.setvariable variable=TargetDir]BoldReportsServer-Linux"
        elif [ -d "$ROOT_DIR/BoldReports_EnterpriseReporting-Linux" ]; then
            TARGET_DIR="$ROOT_DIR/BoldReports_EnterpriseReporting-Linux"
            echo "##vso[task.setvariable variable=TargetDir]BoldReports_EnterpriseReporting-Linux"
        else
            echo "ERROR: Bold Reports package folder not found."
            exit 1
        fi
        echo "Target Directory : $TARGET_DIR"

        echo "======================================================"
        echo "STEP 2 : Copy Docker Files"
        echo "======================================================"
        DOCKER_DIR="$ROOT_DIR/bold-reports-utilities/build/dockerfiles/${{ parameters.docker_files_version }}"
        sudo cp $DOCKER_DIR/bold* $TARGET_DIR/
        ls -ltr "$TARGET_DIR"

        echo "======================================================"
        echo "STEP 3 : Copy Entrypoint Scripts"
        echo "======================================================"
        SCRIPT_BASE="$ROOT_DIR/bold-reports-utilities/movesharedfiles/MoveSharedFiles/shell_scripts"

        declare -A ENTRYPOINTS=(
            ["web"]="$TARGET_DIR/application/reporting/web"
            ["api"]="$TARGET_DIR/application/reporting/api"
            ["jobs"]="$TARGET_DIR/application/reporting/jobs"
            ["designer"]="$TARGET_DIR/application/reporting/reportservice"
            ["viewer"]="$TARGET_DIR/application/reporting/viewer"
            ["id_web"]="$TARGET_DIR/application/idp/web"
            ["id_ums"]="$TARGET_DIR/application/idp/ums"
            ["id_api"]="$TARGET_DIR/application/idp/api"
            ["etl"]="$TARGET_DIR/application/etl/etlservice"
            ["ai"]="$TARGET_DIR/application/ai/reportsaiservice"
            ["mcp"]="$TARGET_DIR/application/ai/reportsmcpservice"
        )

        for src in "${!ENTRYPOINTS[@]}"; do
            if [ -f "$SCRIPT_BASE/$src/entrypoint.sh" ]; then
              sudo cp "$SCRIPT_BASE/$src/entrypoint.sh" "${ENTRYPOINTS[$src]}/"
              echo "$SCRIPT_BASE/$src/entrypoint.sh file moved"
            else
              echo "$SCRIPT_BASE/$src/entrypoint.sh file not found"
            fi
        done

        echo "======================================================"
        echo "STEP 4 : Extract Client Libraries"
        echo "======================================================"
        CLIENT_DIR="$TARGET_DIR/clientlibrary/boldreports"
        TEMP_DIR="$CLIENT_DIR/temp_dir"
        sudo mkdir -p "$TEMP_DIR"
        sudo unzip -q "$CLIENT_DIR/clientlibraries.zip" -d "$TEMP_DIR"
        sudo cp -rf $TEMP_DIR/* $ROOT_DIR/bold-reports-utilities/installscripts/single-docker-image/clientlibrary/MoveSharedFiles/app_data/optional-libs/boldreports/clientlibraries/
        echo "SUCCESS : Client Libraries Copied"

        echo "======================================================"
        echo "STEP 5 : Copy MoveSharedFiles"
        echo "======================================================"
        APPDATA_DIR="$TARGET_DIR/application/idp/web/appdatafiles"
        sudo mkdir -p "$APPDATA_DIR"
        sudo cp -r \
            "$ROOT_DIR/bold-reports-utilities/installscripts/single-docker-image/clientlibrary/MoveSharedFiles" \
            "$APPDATA_DIR/"
        PRODUCT_JSON="$TARGET_DIR/application/app_data/configuration/product.json"
        sudo cp "$PRODUCT_JSON" "$APPDATA_DIR/MoveSharedFiles/app_data/configuration/"
        sudo cp "$PRODUCT_JSON" "$TARGET_DIR/application/idp/api/"
        sudo cp "$PRODUCT_JSON" "$TARGET_DIR/application/idp/ums/"
        echo "MoveSharedFiles Copied"

        echo "======================================================"
        echo "STEP 6 : Copy Optional Libraries"
        echo "======================================================"
        OPTIONAL_LIB_SRC="$APPDATA_DIR/MoveSharedFiles/app_data/optional-libs"
        SERVICES=(api jobs viewer reportservice web)
        for service in "${SERVICES[@]}"; do
            DEST="$TARGET_DIR/application/reporting/$service/optional-libs"
            sudo mkdir -p "$DEST"
            sudo cp -r "$OPTIONAL_LIB_SRC/." "$DEST/"
        done
        echo "FILE PREPARATION COMPLETED SUCCESSFULLY"
      displayName: 'Copy Dockerfiles & Entrypoints'



    #################################################
    # Builder setup
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - bash: |
          echo "Waiting for ARM64 BuildKit..."
          for i in {1..60}
          do
            if nc -z $(arm64_vm_private_ip) 1234; then
              echo "BuildKit reachable"
              exit 0
            fi
            echo "Waiting for ARM64 BuildKit ($i/60)..."
            sleep 10
          done
          echo "BuildKit not reachable"
          exit 1
        displayName: Wait For ARM64 BuildKit

      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true

          docker buildx create \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/amd64 \
            tcp://127.0.0.1:1234

          docker buildx create \
            --append \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/arm64 \
            tcp://$(arm64_vm_private_ip):1234

          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize selfhost Buildx Builder

    - ${{ if eq(parameters.buildType, 'cloud') }}:
      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true
          docker buildx create --name "$(BUILDER_NAME)" --driver cloud "$(CLOUD_BUILDER_ENDPOINT)" --use
          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize cloud Buildx Builder

    #################################################
    # Build selected images (multi-arch, pushed)
    #################################################
    - bash: |
        set -e
        cd "$(Build.SourcesDirectory)/$(TargetDir)"
        R="$(REPOSITORY)"
        T="${{ parameters.imageTag }}"
        ALL="${{ parameters.All }}"

        build() {  # $1=flag  $2=image name  $3=manifest file
          if [ "$ALL" = "True" ] || [ "$1" = "True" ]; then
            echo "=== Building $2:$T ==="
            docker buildx build \
              --builder "$(BUILDER_NAME)" \
              --platform linux/amd64,linux/arm64 \
              --push \
              -t "$2:$T" \
              -f "$3" .
          fi
        }

        build "${{ parameters.ID_WEB }}"               "$R-identity"             bold-identity-manifest.txt
        build "${{ parameters.ID_API }}"               "$R-idp-api"              bold-idp-api-manifest.txt
        build "${{ parameters.ID_UMS }}"               "$R-ums"                  bold-ums-manifest.txt
        build "${{ parameters.Reports_WEB }}"          "${R}reports-server"      boldreports-server-manifest.txt
        build "${{ parameters.Reports_API }}"          "${R}reports-server-api"  boldreports-server-api-manifest.txt
        build "${{ parameters.Reports_JOBS }}"         "${R}reports-server-jobs" boldreports-server-jobs-manifest.txt
        build "${{ parameters.Reports_REPORTSERVCE }}" "${R}reports-designer"    boldreports-designer-manifest.txt
        build "${{ parameters.Reports_VIEWER }}"       "${R}reports-viewer"      boldreports-server-viewer-manifest.txt
        build "${{ parameters.BOLD_ETL }}"             "$R-etl"                  bold-etl-manifest.txt
        build "${{ parameters.Reports_AI }}"           "${R}reports-ai"          boldreports-ai-manifest.txt
        build "${{ parameters.Reports_MCP }}"          "${R}reports-mcp-server"  boldreports-mcp-manifest.txt
      displayName: Build and push images

    #################################################
    # Verify both architectures exist
    #################################################
    - bash: |
        R="$(REPOSITORY)"
        T="${{ parameters.imageTag }}"
        ALL="${{ parameters.All }}"

        check() {  # $1=flag  $2=image name
          if [ "$ALL" = "True" ] || [ "$1" = "True" ]; then
            OUT=$(docker buildx imagetools inspect "$2:$T")
            echo "$OUT" | grep -q "linux/amd64" && echo "$OUT" | grep -q "linux/arm64" \
              && echo "OK multi-arch: $2:$T" \
              || { echo "Missing architecture for $2:$T"; exit 1; }
          fi
        }

        check "${{ parameters.ID_WEB }}"               "$R-identity"
        check "${{ parameters.ID_API }}"               "$R-idp-api"
        check "${{ parameters.ID_UMS }}"               "$R-ums"
        check "${{ parameters.Reports_WEB }}"          "${R}reports-server"
        check "${{ parameters.Reports_API }}"          "${R}reports-server-api"
        check "${{ parameters.Reports_JOBS }}"         "${R}reports-server-jobs"
        check "${{ parameters.Reports_REPORTSERVCE }}" "${R}reports-designer"
        check "${{ parameters.Reports_VIEWER }}"       "${R}reports-viewer"
        check "${{ parameters.BOLD_ETL }}"             "$R-etl"
        check "${{ parameters.Reports_AI }}"           "${R}reports-ai"
        check "${{ parameters.Reports_MCP }}"          "${R}reports-mcp-server"
      displayName: Verify multi-arch images

    #################################################
    # Cleanup (always)
    #################################################
    - bash: docker buildx rm "$(BUILDER_NAME)" || true
      displayName: Remove buildx builder
      condition: always()

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Delete this run's ARM64 VM
        condition: always()
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az vm delete -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --yes --force-deletion true || true
            echo "Deleted $(ARM_VM_NAME)"
