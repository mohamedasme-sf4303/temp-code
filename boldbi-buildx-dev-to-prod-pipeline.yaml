trigger: none

pool:
  name: boldbi-buildx-amd64-vmss-agent-pool

parameters:

- name: devTag
  displayName: Dev Image Tag
  type: string
  default: ''

- name: prodTag
  displayName: Prod Image Tag
  type: string
  default: ''

# Docker Images

- name: dockerDebian
  displayName: Docker Debian
  type: boolean
  default: false

- name: dockerEval
  displayName: Docker Eval
  type: boolean
  default: false

# K8S Images

- name: All
  displayName: Promote All Images
  type: boolean
  default: false

- name: id_web
  displayName: Identity
  type: boolean
  default: false

- name: id_api
  displayName: Identity API
  type: boolean
  default: false

- name: id_ums
  displayName: UMS
  type: boolean
  default: false

- name: bi_web
  displayName: BI Server
  type: boolean
  default: false

- name: bi_api
  displayName: BI API
  type: boolean
  default: false

- name: bi_jobs
  displayName: BI Jobs
  type: boolean
  default: false

- name: bi_designer
  displayName: BI Designer
  type: boolean
  default: false

- name: bold_etl
  displayName: Bold ETL
  type: boolean
  default: false

- name: bold_ai
  displayName: Bold AI
  type: boolean
  default: false

- name: bold_mcp
  displayName: Bold MCP
  type: boolean
  default: false

steps:

- bash: |
    echo "$(DOCKER_PASSWORD)" | docker login \
      -u "$(DOCKER_USERNAME)" \
      --password-stdin
  displayName: DockerLogin

#################################################
# Docker Debian
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-docker:${{ parameters.devTag }}

  displayName: Promote Docker Debian
  condition: eq('${{ parameters.dockerDebian }}', true)

#################################################
# Docker Eval
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi:${{ parameters.prodTag }}_eval \
      syncfusion/dev-boldbi-docker:${{ parameters.devTag }}_eval

  displayName: Promote Docker Eval
  condition: eq('${{ parameters.dockerEval }}', true)

#################################################
# Identity
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-identity:${{ parameters.prodTag }} \
      syncfusion/dev-bold-identity:${{ parameters.devTag }}

  displayName: Promote Identity
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.id_web }}', true))

#################################################
# Identity API
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-identity-api:${{ parameters.prodTag }} \
      syncfusion/dev-bold-identity-api:${{ parameters.devTag }}

  displayName: Promote Identity API
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.id_api }}', true))

#################################################
# UMS
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-ums:${{ parameters.prodTag }} \
      syncfusion/dev-bold-ums:${{ parameters.devTag }}

  displayName: Promote UMS
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.id_ums }}', true))

#################################################
# BI Server
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi-server:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-server:${{ parameters.devTag }}

  displayName: Promote BI Server
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bi_web }}', true))

#################################################
# BI API
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi-server-api:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-server-api:${{ parameters.devTag }}

  displayName: Promote BI API
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bi_api }}', true))

#################################################
# BI Jobs
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi-server-jobs:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-server-jobs:${{ parameters.devTag }}

  displayName: Promote BI Jobs
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bi_jobs }}', true))

#################################################
# BI Designer
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi-designer:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-designer:${{ parameters.devTag }}

  displayName: Promote BI Designer
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bi_designer }}', true))

#################################################
# ETL
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-etl:${{ parameters.prodTag }} \
      syncfusion/dev-bold-etl:${{ parameters.devTag }}

  displayName: Promote ETL
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bold_etl }}', true))

#################################################
# AI
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-ai:${{ parameters.prodTag }} \
      syncfusion/dev-bold-ai:${{ parameters.devTag }}

  displayName: Promote AI
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bold_ai }}', true))

#################################################
# MCP
#################################################

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldbi-mcp-server:${{ parameters.prodTag }} \
      syncfusion/dev-boldbi-mcp-server:${{ parameters.devTag }}

  displayName: Promote MCP
  condition: or(eq('${{ parameters.All }}', true), eq('${{ parameters.bold_mcp }}', true))
