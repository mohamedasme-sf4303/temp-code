trigger: none

pool:
  name: boldreports-buildx-amd64-vmss-agent-pool

parameters:

- name: devTag
  displayName: Dev Image Tag
  type: string
  default: ''

- name: prodTag
  displayName: Prod Image Tag
  type: string
  default: ''

# Docker Images

- name: dockerDebian
  displayName: Docker Debian
  type: boolean
  default: false

- name: dockerEval
  displayName: Docker Eval
  type: boolean
  default: false

# K8S Images

- name: k8sAll
  displayName: K8S All Images
  type: boolean
  default: false

- name: idWeb
  displayName: ID Web
  type: boolean
  default: false

- name: idApi
  displayName: ID API
  type: boolean
  default: false

- name: idUms
  displayName: ID UMS
  type: boolean
  default: false

- name: reportsWeb
  displayName: Reports Web
  type: boolean
  default: false

- name: reportsApi
  displayName: Reports API
  type: boolean
  default: false

- name: reportsJobs
  displayName: Reports Jobs
  type: boolean
  default: false

- name: designer
  displayName: Designer
  type: boolean
  default: false

- name: viewer
  displayName: Viewer
  type: boolean
  default: false

- name: etl
  displayName: ETL
  type: boolean
  default: false

- name: ai
  displayName: AI
  type: boolean
  default: false

- name: mcp
  displayName: MCP
  type: boolean
  default: false

steps:

- task: Docker@2
  displayName: Docker Login
  inputs:
    containerRegistry: 'dockerhub-CI'
    command: 'login'

# Docker Debian

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-docker:${{ parameters.devTag }}

  displayName: Promote Docker Debian
  condition: eq('${{ parameters.dockerDebian }}', true)

# Docker Eval

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports:${{ parameters.prodTag }}_eval \
      syncfusion/dev-boldreports-docker:${{ parameters.devTag }}_eval

  displayName: Promote Docker Eval
  condition: eq('${{ parameters.dockerEval }}', true)

# ID Web

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-identity:${{ parameters.prodTag }} \
      syncfusion/dev-bold-identity:${{ parameters.devTag }}

  displayName: Promote ID Web
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.idWeb }}', true))

# ID API

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-idp-api:${{ parameters.prodTag }} \
      syncfusion/dev-bold-idp-api:${{ parameters.devTag }}

  displayName: Promote ID API
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.idApi }}', true))

# ID UMS

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-ums:${{ parameters.prodTag }} \
      syncfusion/dev-bold-ums:${{ parameters.devTag }}

  displayName: Promote ID UMS
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.idUms }}', true))

# Reports Web

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-server:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-server:${{ parameters.devTag }}

  displayName: Promote Reports Web
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.reportsWeb }}', true))

# Reports API

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-server-api:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-server-api:${{ parameters.devTag }}

  displayName: Promote Reports API
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.reportsApi }}', true))

# Reports Jobs

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-server-jobs:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-server-jobs:${{ parameters.devTag }}

  displayName: Promote Reports Jobs
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.reportsJobs }}', true))

# Designer

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-designer:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-designer:${{ parameters.devTag }}

  displayName: Promote Designer
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.designer }}', true))

# Viewer

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-viewer:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-viewer:${{ parameters.devTag }}

  displayName: Promote Viewer
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.viewer }}', true))

# ETL

- bash: |
    docker buildx imagetools create \
      -t syncfusion/bold-etl:${{ parameters.prodTag }} \
      syncfusion/dev-bold-etl:${{ parameters.devTag }}

  displayName: Promote ETL
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.etl }}', true))

# AI

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-ai:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-ai:${{ parameters.devTag }}

  displayName: Promote AI
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.ai }}', true))

# MCP

- bash: |
    docker buildx imagetools create \
      -t syncfusion/boldreports-mcp-server:${{ parameters.prodTag }} \
      syncfusion/dev-boldreports-mcp-server:${{ parameters.devTag }}

  displayName: Promote MCP
  condition: or(eq('${{ parameters.k8sAll }}', true), eq('${{ parameters.mcp }}', true))
