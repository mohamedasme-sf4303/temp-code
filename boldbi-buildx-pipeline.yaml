trigger: none

variables:
  AZ_SERVICE_CONNECTION: boldbi-buildx-new-services-connetion-for-amd64
  ARM_RG: boldbi-test
  ARM_IMAGE_ID: /subscriptions/b7ba5c62-bc85-451a-a00e-0a9ceddf48c3/resourceGroups/boldbi-test/providers/Microsoft.Compute/galleries/boldreports_ga/images/boldreports_buildx_arm64/versions/0.0.1
  ARM_VM_SIZE: Standard_D2ps_v6
  ARM_VM_NAME: boldbi-sh-arm-$(Build.BuildId)
  BUILDER_NAME: boldbi-builder-$(Build.BuildId)
  ARM_VNET: buildx-vnet
  ARM_SUBNET: buildx-sub
  ARM_ADMIN_PASSWORD: Admin@123123

parameters:

- name: imageTag
  type: string
  default: latest

- name: boldbiPackage
  type: string
  default: ''

- name: environment
  type: string
  default: dev
  values:
    - dev
    - production

- name: imagesType
  type: string
  default: eval
  values:
    - debian
    - eval
    - both

- name: buildType
  displayName: Build Type
  type: string
  default: selfhost
  values:
    - cloud
    - selfhost

stages:

- stage: Build

  jobs:

  - job: DockerBuild

    pool:
      name: boldbi-buildx-amd64-vmss-agent-pool-new

    steps:

    - bash: |
        TAG="${{ parameters.imageTag }}_$(Build.BuildId)"

        if [[ ! "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
          echo "Invalid Docker image tag: $TAG"
          exit 1
        fi

        echo "Image tag validation successful"
      displayName: Validate Tag

    - bash: |
        if [ "${{ parameters.environment }}" = "dev" ]; then
          REPO="syncfusion/dev-boldbi-docker"
        else
          REPO="syncfusion/boldbi"
        fi

        echo "##vso[task.setvariable variable=REPOSITORY]$REPO"
      displayName: Set Docker Repository

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Create ARM64 VM
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eo pipefail

            az vm create \
              --resource-group "$(ARM_RG)" \
              --location eastus \
              --name "$(ARM_VM_NAME)" \
              --image "$(ARM_IMAGE_ID)" \
              --size "$(ARM_VM_SIZE)" \
              --security-type TrustedLaunch \
              --enable-secure-boot true \
              --enable-vtpm true \
              --vnet-name "$(ARM_VNET)" \
              --subnet "$(ARM_SUBNET)" \
              --nsg "" \
              --public-ip-address "" \
              --admin-username azureuser \
              --authentication-type password \
              --admin-password "$ARM_ADMIN_PASSWORD" \
              --nic-delete-option Delete \
              --os-disk-delete-option Delete \
              --tags pipelineBuildId=$(Build.BuildId)

            ARM64_IP=$(az vm show -d -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --query privateIps -o tsv)

            if [ -z "$ARM64_IP" ]; then
              echo "ARM64 IP not found"
              exit 1
            fi

            echo "##vso[task.setvariable variable=arm64_vm_private_ip]$ARM64_IP"
        env:
          ARM_ADMIN_PASSWORD: $(ARM_ADMIN_PASSWORD)

    - bash: |
        wget "${{ parameters.boldbiPackage }}"

        unzip BoldBI*.zip

        cd BoldBIServer-Linux

        wget https://raw.githubusercontent.com/mohamedasme-sf4303/temp-code/refs/heads/main/boldbi-manifets.txt
      displayName: Download Package

    - task: Docker@2
      displayName: Docker Login
      inputs:
        containerRegistry: dockerhub-CI
        command: login

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - bash: |
          echo "Waiting for ARM64 BuildKit..."

          for i in {1..60}
          do
            if nc -z $(arm64_vm_private_ip) 1234; then
              echo "BuildKit reachable"
              exit 0
            fi

            echo "Waiting BuildKit ($i/60)..."
            sleep 10
          done

          echo "BuildKit not reachable"
          exit 1
        displayName: Wait For BuildKit

      - bash: |
          set -e

          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true

          docker buildx create \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/amd64 \
            tcp://127.0.0.1:1234

          docker buildx create \
            --append \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/arm64 \
            tcp://$(arm64_vm_private_ip):1234

          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize selfhost Buildx Builder

    - ${{ if eq(parameters.buildType, 'cloud') }}:
      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true
          docker buildx create --name "$(BUILDER_NAME)" --driver cloud "syncfusion/boldbi-cloud"
          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize cloud Buildx Builder

    - bash: |
        set -e

        DEBIAN_IMAGE="$(REPOSITORY):${{ parameters.imageTag }}_$(Build.BuildId)"
        EVAL_IMAGE="$(REPOSITORY):${{ parameters.imageTag }}_$(Build.BuildId)_eval"

        cd BoldBIServer-Linux

        if [ "${{ parameters.imagesType }}" = "debian" ] || [ "${{ parameters.imagesType }}" = "both" ]; then

          echo "Building Debian Image"

          docker buildx build \
            --builder "$(BUILDER_NAME)" \
            --platform linux/amd64,linux/arm64 \
            -t "$DEBIAN_IMAGE" \
            -f boldbi-manifets.txt \
            --push .
        fi

        if [ "${{ parameters.imagesType }}" = "eval" ] || [ "${{ parameters.imagesType }}" = "both" ]; then

          echo "Building Eval Image"

          docker buildx build \
            --builder "$(BUILDER_NAME)" \
            --platform linux/amd64,linux/arm64 \
            --build-arg INSTALL_POSTGRES=true \
            -t "$EVAL_IMAGE" \
            -f boldbi-manifets.txt \
            --push .
        fi
      displayName: Build Multi Arch Image

    - bash: |
        TAG="${{ parameters.imageTag }}_$(Build.BuildId)"

        check() {
          OUT=$(docker buildx imagetools inspect "$1")

          echo "$OUT" | grep -q "linux/amd64" && \
          echo "$OUT" | grep -q "linux/arm64" && \
          echo "OK multiarch : $1" || exit 1
        }

        if [ "${{ parameters.imagesType }}" = "debian" ] || [ "${{ parameters.imagesType }}" = "both" ]; then
          check "$(REPOSITORY):${TAG}"
        fi

        if [ "${{ parameters.imagesType }}" = "eval" ] || [ "${{ parameters.imagesType }}" = "both" ]; then
          check "$(REPOSITORY):${TAG}_eval"
        fi
      displayName: Verify Multi-Arch Images

    - bash: |
        docker buildx rm "$(BUILDER_NAME)" || true
        docker system prune -af || true
      displayName: Cleanup Docker
      condition: always()

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Delete ARM64 VM
        condition: always()
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az vm delete \
              -g "$(ARM_RG)" \
              -n "$(ARM_VM_NAME)" \
              --yes \
              --force-deletion true || true

            echo "Deleted $(ARM_VM_NAME)"
