trigger: none

variables:
  AZ_SERVICE_CONNECTION: bold-reports-buildx-services-connection
  ARM_RG: bold-bi-reports-buildx
  ARM_IMAGE_ID: /subscriptions/80e2133e-f876-4916-806d-cd252db82d0d/resourceGroups/bold-bi-reports-buildx/providers/Microsoft.Compute/galleries/bold_bi_reports_buildx_image_gallery/images/bold_bi_reports_buildx_arm64_image/versions/1.0.0
  ARM_VM_SIZE: Standard_D2ps_v6
  ARM_VM_NAME: boldreports-arm-$(Build.BuildId)
  BUILDER_NAME: boldreports-builder-$(Build.BuildId)
  ARM_VNET: bold-bi-reports-buildx
  ARM_SUBNET: bold-bi-reports-buildx-subnet
  CLOUD_BUILDER_ENDPOINT: syncfusion/boldbi-cloud
  ARM_ADMIN_PASSWORD: Admin@123123

parameters:
  - name: imageTag
    displayName: Docker Image Tag
    type: string
    default: latest
  - name: boldbiPackage
    displayName: BoldBI Package
    type: string
    default: https://s3.amazonaws.com/files2.syncfusion.com/Installs/BoldBI/07-08-2026/BoldBIServer_Linux_Docker_16.2.5_08072026_091439.zip
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values: [dev, production]
  - name: buildType
    displayName: Build Type
    type: string
    default: selfhost
    values: [cloud, selfhost]
  - name: github_branch
    displayName: BoldBI CI BranchName
    type: string
    default: development
  - name: All
    displayName: Build All Images
    type: boolean
    default: false
  - name: id_web
    displayName: Build id_web (Identity)
    type: boolean
    default: false
  - name: id_api
    displayName: Build id_api
    type: boolean
    default: false
  - name: id_ums
    displayName: Build id_ums
    type: boolean
    default: false
  - name: bi_designer
    displayName: Build BI Designer
    type: boolean
    default: false
  - name: bi_web
    displayName: Build BI Web
    type: boolean
    default: false
  - name: bi_api
    displayName: Build BI API
    type: boolean
    default: false
  - name: bi_jobs
    displayName: Build BI Jobs
    type: boolean
    default: false
  - name: bold_etl
    displayName: Build Bold ETL
    type: boolean
    default: false
  - name: bold_ai
    displayName: Build Bold AI
    type: boolean
    default: false
  - name: bold_mcp
    displayName: Build Bold MCP
    type: boolean
    default: false

stages:
- stage: Build
  jobs:
  - job: DockerBuild
    displayName: Build Docker Images
    workspace:
      clean: all
    pool:
      name: bold-reports-buildx-amd64-vmss-agnet-pool

    steps:
    - checkout: none

    - bash: |
        TAG="${{ parameters.imageTag }}"
        if [[ ! "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
          echo "Invalid Docker image tag: $TAG"
          exit 1
        fi
        echo "Image tag validation successful"
      displayName: Validate image tag

    - bash: |
        if [ "${{ parameters.environment }}" = "dev" ]; then
          REPO="syncfusion/dev-bold"
        else
          REPO="syncfusion/bold"
        fi
        echo "##vso[task.setvariable variable=REPOSITORY]$REPO"
      displayName: Set Docker Repository

    #################################################
    # Create ARM64 VM (selfhost only; deleted in the last step)
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Create ARM64 VM
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eo pipefail

            az vm create \
              --resource-group "$(ARM_RG)" \
              --location eastus \
              --name "$(ARM_VM_NAME)" \
              --image "$(ARM_IMAGE_ID)" \
              --size "$(ARM_VM_SIZE)" \
              --security-type TrustedLaunch \
              --enable-secure-boot true \
              --enable-vtpm true \
              --vnet-name "$(ARM_VNET)" \
              --subnet "$(ARM_SUBNET)" \
              --nsg "" \
              --public-ip-address "" \
              --admin-username azureuser \
              --authentication-type password \
              --admin-password "$ARM_ADMIN_PASSWORD" \
              --nic-delete-option Delete \
              --os-disk-delete-option Delete \
              --tags pipelineBuildId=$(Build.BuildId)

            ARM64_IP=$(az vm show -d -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --query privateIps -o tsv)
            if [ -z "$ARM64_IP" ]; then
              echo "ARM64 IP not found"
              exit 1
            fi
            echo "##vso[task.setvariable variable=arm64_vm_private_ip]$ARM64_IP"
        env:
          ARM_ADMIN_PASSWORD: $(ARM_ADMIN_PASSWORD)

    #################################################
    # Checkout + prepare application and Dockerfiles
    #################################################
    - task: Syncfusion Gitea Checkout@1
      inputs:
        giteaUrl: 'https://gitea.syncfusion.com/bold-bi/boldbi-ci'
        branch: '${{ parameters.github_branch }}'
      displayName: 'Checkout boldbi-ci'

    - script: |
        ls -la
        mkdir -p boldbi-ci
        shopt -s extglob
        cp -r !(boldbi-ci) boldbi-ci/
      displayName: 'Organize files into boldbi-ci'

    - task: Bash@3
      displayName: 'Prepare Application and Dockerfiles'
      inputs:
        targetType: 'inline'
        script: |
          sudo wget "${{ parameters.boldbiPackage }}"
          sudo apt install -y unzip
          sudo unzip BoldBI*.zip
          WORK_DIR="$(System.DefaultWorkingDirectory)"
          if [ -d "$WORK_DIR/BoldBIServer-Linux" ]; then
              TARGET_DIR="$WORK_DIR/BoldBIServer-Linux"
          elif [ -d "$WORK_DIR/BoldBIEnterpriseEdition-Linux" ]; then
              TARGET_DIR="$WORK_DIR/BoldBIEnterpriseEdition-Linux"
          else
              echo "ERROR: Extracted package folder not found."
              exit 1
          fi
          echo "##vso[task.setvariable variable=extractPath]$TARGET_DIR"

          sudo rm -f BoldBI*.zip

          K8S="$WORK_DIR/boldbi-ci/installscripts/jenkins-ci/kubernetes"

          sudo mkdir -p $TARGET_DIR/application/idp/web/appdatafiles
          sudo mkdir -p $TARGET_DIR/application/idp/api/appdatafiles
          sudo mkdir -p $TARGET_DIR/application/idp/ums/appdatafiles

          for d in web api ums; do
            sudo cp -r $TARGET_DIR/application/utilities/installutils \
                       $TARGET_DIR/application/idp/$d/appdatafiles/installutils
          done

          sudo cp -r $K8S/shell_scripts/id_web/*   $TARGET_DIR/application/idp/web/
          sudo cp -r $K8S/shell_scripts/id_ums/*   $TARGET_DIR/application/idp/ums/
          sudo cp -r $K8S/shell_scripts/id_api/*   $TARGET_DIR/application/idp/api/
          sudo cp -r $K8S/shell_scripts/designer/* $TARGET_DIR/application/bi/dataservice/
          sudo cp -r $K8S/shell_scripts/bi_api/*   $TARGET_DIR/application/bi/api/
          sudo cp -r $K8S/shell_scripts/bi_jobs/*  $TARGET_DIR/application/bi/jobs/
          sudo cp -r $K8S/shell_scripts/bi_web/*   $TARGET_DIR/application/bi/web/
          sudo cp -r $K8S/shell_scripts/bold_ai/*  $TARGET_DIR/application/ai/aiservice/
          sudo cp -r $K8S/shell_scripts/bold_mcp/* $TARGET_DIR/application/ai/mcpservice/
          sudo cp -r $K8S/shell_scripts/bold_etl/* $TARGET_DIR/application/etl/etlservice/
          sudo cp $TARGET_DIR/application/app_data/configuration/product.json $TARGET_DIR/application/idp/api/
          sudo cp $TARGET_DIR/application/app_data/configuration/product.json $TARGET_DIR/application/idp/ums/

          sudo cp -r $TARGET_DIR/application/app_data/* \
                     $TARGET_DIR/application/idp/web/appdatafiles/installutils/app_data/

          sudo unzip -o $TARGET_DIR/clientlibrary/clientlibrary.zip \
                     -d $TARGET_DIR/application/bi/dataservice/optional-libs

          sudo ls $TARGET_DIR/application/bi/dataservice/puppeteer/Chrome

          destDir="$TARGET_DIR/"
          ubuntuDir="$K8S/dockerfiles/debian/"
          arm64Dir="$K8S/dockerfiles/debian-arm64/"
          manifestDir="$K8S/dockerfiles/manifest/"

          for txtFile in "$arm64Dir"*.txt; do
            [ -f "$txtFile" ] || continue
            imageName=$(basename "$txtFile" | sed 's/^[^-]*-//' | sed 's/\.txt$//')
            sudo cp "$txtFile" "$destDir/${imageName}.Dockerfile"
          done
          for txtFile in "$ubuntuDir"*.txt; do
            [ -f "$txtFile" ] || continue
            imageName=$(basename "$txtFile" | sed 's/^[^-]*-//' | sed 's/\.txt$//')
            sudo cp "$txtFile" "$destDir/${imageName}-amd64.Dockerfile"
          done
          for txtFile in "$manifestDir"*.txt; do
            [ -f "$txtFile" ] || continue
            imageName=$(basename "$txtFile" | sed 's/^[^-]*-//' | sed 's/\.txt$//')
            sudo cp "$txtFile" "$destDir/${imageName}-manifest.Dockerfile"
          done

          sudo ls -la "$destDir"/*.Dockerfile

    - bash: |
        echo "$(DOCKER_PASSWORD)" | docker login \
          -u "$(DOCKER_USERNAME)" \
          --password-stdin
      displayName: Docker Login

    #################################################
    # Builder setup
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - bash: |
          echo "Waiting for ARM64 BuildKit..."
          for i in {1..60}; do
            if nc -z $(arm64_vm_private_ip) 1234; then
              echo "BuildKit reachable"
              exit 0
            fi
            echo "Waiting BuildKit ($i/60)..."
            sleep 10
          done
          echo "BuildKit not reachable"
          exit 1
        displayName: Wait For BuildKit

      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true

          docker buildx create \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/amd64 \
            tcp://127.0.0.1:1234

          docker buildx create \
            --append \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/arm64 \
            tcp://$(arm64_vm_private_ip):1234

          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize selfhost Buildx Builder

    - ${{ if eq(parameters.buildType, 'cloud') }}:
      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true
          docker buildx create --name "$(BUILDER_NAME)" --driver cloud "syncfusion/boldbi-cloud"
          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize cloud Buildx Builder

    #################################################
    # Builds
    #################################################
    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)-identity:${{ parameters.imageTag }}" \
          -f identity-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build Identity Web
      condition: and(succeeded(), or(eq('${{ parameters.id_web }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)-identity-api:${{ parameters.imageTag }}" \
          -f identity-api-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build Identity API
      condition: and(succeeded(), or(eq('${{ parameters.id_api }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)-ums:${{ parameters.imageTag }}" \
          -f ums-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build UMS
      condition: and(succeeded(), or(eq('${{ parameters.id_ums }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)bi-server:${{ parameters.imageTag }}" \
          -f server-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build BI Server
      condition: and(succeeded(), or(eq('${{ parameters.bi_web }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)bi-server-api:${{ parameters.imageTag }}" \
          -f server-api-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build BI Server API
      condition: and(succeeded(), or(eq('${{ parameters.bi_api }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)bi-server-jobs:${{ parameters.imageTag }}" \
          -f server-jobs-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build BI Jobs
      condition: and(succeeded(), or(eq('${{ parameters.bi_jobs }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)bi-designer:${{ parameters.imageTag }}" \
          -f designer-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build BI Designer
      condition: and(succeeded(), or(eq('${{ parameters.bi_designer }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)-etl:${{ parameters.imageTag }}" \
          -f etl-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build ETL
      condition: and(succeeded(), or(eq('${{ parameters.bold_etl }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)-ai:${{ parameters.imageTag }}" \
          -f ai-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build AI
      condition: and(succeeded(), or(eq('${{ parameters.bold_ai }}', true), eq('${{ parameters.All }}', true)))

    - bash: |
        cd BoldBIServer-Linux
        docker buildx build --builder "$(BUILDER_NAME)" \
          --platform linux/amd64,linux/arm64 --push \
          -t "$(REPOSITORY)bi-mcp-server:${{ parameters.imageTag }}" \
          -f mcp-manifest.Dockerfile .
        docker buildx prune -af || true
      displayName: Build MCP
      condition: and(succeeded(), or(eq('${{ parameters.bold_mcp }}', true), eq('${{ parameters.All }}', true)))

    #################################################
    # Verify multi-arch
    #################################################
    - bash: |
        TAG="${{ parameters.imageTag }}"
        R="$(REPOSITORY)"
        IMAGES=()
        sel() { [ "${{ parameters.All }}" = "True" ] || [ "$1" = "True" ]; }

        sel "${{ parameters.id_web }}"      && IMAGES+=("${R}-identity:$TAG")
        sel "${{ parameters.id_api }}"      && IMAGES+=("${R}-identity-api:$TAG")
        sel "${{ parameters.id_ums }}"      && IMAGES+=("${R}-ums:$TAG")
        sel "${{ parameters.bi_web }}"      && IMAGES+=("${R}bi-server:$TAG")
        sel "${{ parameters.bi_api }}"      && IMAGES+=("${R}bi-server-api:$TAG")
        sel "${{ parameters.bi_jobs }}"     && IMAGES+=("${R}bi-server-jobs:$TAG")
        sel "${{ parameters.bi_designer }}" && IMAGES+=("${R}bi-designer:$TAG")
        sel "${{ parameters.bold_etl }}"    && IMAGES+=("${R}-etl:$TAG")
        sel "${{ parameters.bold_ai }}"     && IMAGES+=("${R}-ai:$TAG")
        sel "${{ parameters.bold_mcp }}"    && IMAGES+=("${R}bi-mcp-server:$TAG")

        if [ ${#IMAGES[@]} -eq 0 ]; then
          echo "No images selected."
          exit 0
        fi

        for IMG in "${IMAGES[@]}"; do
          OUT=$(docker buildx imagetools inspect "$IMG")
          if echo "$OUT" | grep -q "linux/amd64" && echo "$OUT" | grep -q "linux/arm64"; then
            echo "OK multiarch: $IMG"
          else
            echo "NOT multiarch: $IMG"
            exit 1
          fi
        done
      displayName: Verify Multi-Arch Images

    #################################################
    # Cleanup (always)
    #################################################
    - bash: |
        docker buildx rm "$(BUILDER_NAME)" || true
        docker system prune -af || true
      displayName: Cleanup Docker
      condition: always()

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Delete ARM64 VM
        condition: always()
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az vm delete \
              -g "$(ARM_RG)" \
              -n "$(ARM_VM_NAME)" \
              --yes \
              --force-deletion true || true
            echo "Deleted $(ARM_VM_NAME)"
