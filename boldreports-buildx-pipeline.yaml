trigger: none

variables:
  AZ_SERVICE_CONNECTION: bold-reports-buildx-services-connection
  ARM_RG: bold-bi-reports-buildx
  ARM_IMAGE_ID: /subscriptions/80e2133e-f876-4916-806d-cd252db82d0d/resourceGroups/bold-bi-reports-buildx/providers/Microsoft.Compute/galleries/bold_bi_reports_buildx_image_gallery/images/bold_bi_reports_buildx_arm64_image/versions/1.0.0
  ARM_VM_SIZE: Standard_D2ps_v6
  ARM_VM_NAME: boldreports-arm-$(Build.BuildId)
  BUILDER_NAME: boldreports-builder-$(Build.BuildId)
  ARM_VNET: bold-bi-reports-buildx
  ARM_SUBNET: bold-bi-reports-buildx-subnet
  CLOUD_BUILDER_ENDPOINT: syncfusion/boldbi-cloud
  ARM_ADMIN_PASSWORD: Admin@123123

parameters:
- name: imageTag
  displayName: Docker Image Tag
  type: string
  default: latest
- name: linux_package
  displayName: 'Docker Linux Package URL'
  type: string
  default: ''
- name: environment
  displayName: Environment
  type: string
  default: dev
  values:
    - dev
    - production
- name: buildType
  displayName: Build Type
  type: string
  default: selfhost
  values:
    - cloud
    - selfhost
- name: imagesType
  displayName: Images Type
  type: string
  default: eval
  values:
    - debian
    - eval
    - both
- name: utility_branch_name
  displayName: 'Utility Branch Name'
  type: string
  default: 'development'
- name: packageType
  displayName: 'Package Type. Note: If you are using Bold Reports version 12.2 below with Docker packages, or if you are using Linux packages, you need to choose the move_files option.'
  type: string
  values:
    - move_files
    - no_move_files
  default: move_files

stages:
- stage: Build
  jobs:
  - job: DockerBuild
    displayName: Build Docker Image
    timeoutInMinutes: 240
    pool:
      name: bold-reports-buildx-amd64-vmss-agnet-pool
    steps:

    - bash: |
        TAG="${{ parameters.imageTag }}_$(Build.BuildId)"
        if [[ ! "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
          echo "Invalid Docker image tag: $TAG"
          exit 1
        fi
        echo "Image tag validation successful"
      displayName: Validate Tag

    - bash: |
        if [ "${{ parameters.environment }}" = "dev" ]; then
          REPO="syncfusion/dev-boldreports-docker"
        else
          REPO="syncfusion/boldreports"
        fi
        echo "##vso[task.setvariable variable=REPOSITORY]$REPO"
      displayName: Set Docker Repository

    #################################################
    # Create this run's ARM64 VM (selfhost only)
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Create ARM64 VM
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -eo pipefail
            ARGS=(
              --resource-group "$(ARM_RG)"
              --location eastus
              --name "$(ARM_VM_NAME)"
              --image "$(ARM_IMAGE_ID)"
              --size "$(ARM_VM_SIZE)"
              --security-type TrustedLaunch
              --enable-secure-boot true
              --enable-vtpm true
              --vnet-name "$(ARM_VNET)"
              --subnet "$(ARM_SUBNET)"
              --nsg ""
              --public-ip-address ""
              --admin-username azureuser
              --authentication-type password
              --admin-password "$ARM_ADMIN_PASSWORD"
              --nic-delete-option Delete
              --os-disk-delete-option Delete
              --tags pipelineBuildId=$(Build.BuildId) createdBy=azdo-buildx
            )
            az vm create "${ARGS[@]}"
            ARM64_IP=$(az vm show -d -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --query privateIps -o tsv)
            if [ -z "$ARM64_IP" ]; then
              echo "ARM64 IP not found"
              exit 1
            fi
            echo "ARM64 VM: $(ARM_VM_NAME)  IP: $ARM64_IP"
            echo "##vso[task.setvariable variable=arm64_vm_private_ip]$ARM64_IP"
        env:
          ARM_ADMIN_PASSWORD: $(ARM_ADMIN_PASSWORD)

    #################################################
    # Download Package & Utilities
    #################################################
    - bash: |
        cd "$(Build.SourcesDirectory)"
        sudo rm -rf *
        wget "${{ parameters.linux_package }}"
        unzip BoldReports*.zip
        rm -f BoldReports*.zip

        if [ -d "$(Build.SourcesDirectory)/BoldReportsServer-Linux" ]; then
            EXTRACT_PATH="$(Build.SourcesDirectory)/BoldReportsServer-Linux"
        elif [ -d "$(Build.SourcesDirectory)/BoldReports_EnterpriseReporting-Linux" ]; then
            EXTRACT_PATH="$(Build.SourcesDirectory)/BoldReports_EnterpriseReporting-Linux"
        else
            echo "ERROR: Bold Reports package folder not found."
            exit 1
        fi
        echo "##vso[task.setvariable variable=extractPath]$EXTRACT_PATH"
      displayName: Download & Extract Package

    - ${{ if eq(parameters.packageType, 'move_files') }}:
      - task: Syncfusion Gitea Checkout@1
        inputs:
          giteaUrl: 'https://gitea.syncfusion.com/bold-reports/bold-reports-utilities'
          branch: '${{ parameters.utility_branch_name }}'
        displayName: 'Clone Bold Reports Utilities'

    #################################################
    # Docker Login (same login for cloud and selfhost)
    #################################################
    - bash: |
        echo "$(DOCKER_PASSWORD)" | docker login \
          --username syncfusion \
          --password-stdin
      displayName: Docker Login

    #################################################
    # Wait For ARM64 BuildKit (selfhost only)
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - bash: |
          echo "Waiting for ARM64 BuildKit..."
          for i in {1..60}
          do
            if nc -z $(arm64_vm_private_ip) 1234; then
              echo "BuildKit reachable"
              exit 0
            fi
            echo "Waiting BuildKit ($i/60)..."
            sleep 10
          done
          echo "BuildKit not reachable"
          exit 1
        displayName: Wait For BuildKit

    #################################################
    # Prepare Files
    #################################################
    - ${{ if eq(parameters.packageType, 'move_files') }}:
      - bash: |
          utilityBasePath="$(Build.SourcesDirectory)/bold-reports-utilities/build/dockerfiles/latest/single-docker-image"

          echo "=== MOVE_FILES MODE ==="
          echo "Utility base path: $utilityBasePath"
          ls -R "$utilityBasePath/" || true

          if [ -f "$(extractPath)/application/app_data/configuration/product.json" ]; then
              configFilePath="$(extractPath)/application/app_data/configuration/product.json"
          elif [ -f "$(extractPath)/application/product.json" ]; then
              configFilePath="$(extractPath)/application/product.json"
          else
              echo "##[error]product.json not found"
              exit 1
          fi

          version=$(jq -r '.BoldProducts[0].Version' "$configFilePath")
          idpVersion=$(jq -r '.BoldProducts[0].IDPVersion' "$configFilePath")
          echo "Version: $version | IDPVersion: $idpVersion"

          if [ -f "$utilityBasePath/product.json" ]; then
            sed -i "s|\"Version\": *\"[^\"]*\"|\"Version\": \"$version\"|g" "$utilityBasePath/product.json"
            sed -i "s|\"IDPVersion\": *\"[^\"]*\"|\"IDPVersion\": \"$idpVersion\"|g" "$utilityBasePath/product.json"
          fi

          echo "Copying Dockerfiles..."
          cp -v "$utilityBasePath/dockerfiles/"* "$(extractPath)/" || true

          cp -rv "$utilityBasePath/boldreports-nginx-config" "$(extractPath)/application/" || true
          cp -v "$utilityBasePath/entrypoint.sh" "$(extractPath)/application/" || true
          cp -v "$utilityBasePath/product.json" "$(extractPath)/application/" || true
          cp -rv "$utilityBasePath/clientlibrary" "$(extractPath)/application/" || true

          if [ -f "$(extractPath)/application/clientlibrary/boldreports/clientlibraries.zip" ]; then
            cd "$(extractPath)/application/clientlibrary/boldreports/"
            unzip -o clientlibraries.zip -d "$(extractPath)/application/clientlibrary/clientlibraries/"
          fi

          mkdir -p "$(extractPath)/application/clientlibrary/MoveSharedFiles/app_data/configuration"
          cp -v "$(extractPath)/application/product.json" "$(extractPath)/application/clientlibrary/MoveSharedFiles/app_data/configuration/"

          cp -r "$(extractPath)/application/clientlibrary/"* "$(extractPath)/application/utilities/" || true

          mkdir -p "$(extractPath)/application/idp/web/appdatafiles"
          cp -r "$(extractPath)/application/clientlibrary/MoveSharedFiles" "$(extractPath)/application/idp/web/appdatafiles/"
          rm -rf "$(extractPath)/application/app_data"

          dos2unix "$(extractPath)/application/entrypoint.sh" || true
          dos2unix "$(extractPath)/application/clientlibrary/install-optional.libs.sh" || true

          echo "=== Files prepared for buildx ==="
        displayName: 'Prepare Files (move_files)'

    - ${{ else }}:
      - bash: |
          echo "=== NO_MOVE_FILES MODE ==="
          [ -f "$(extractPath)/application/entrypoint.sh" ] && dos2unix "$(extractPath)/application/entrypoint.sh"
          [ -f "$(extractPath)/application/clientlibrary/install-optional.libs.sh" ] && dos2unix "$(extractPath)/application/clientlibrary/install-optional.libs.sh"
          true
        displayName: 'Prepare Files (no_move_files)'

    #################################################
    # Builder setup
    #################################################
    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true

          docker buildx create \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/amd64 \
            tcp://127.0.0.1:1234

          docker buildx create \
            --append \
            --name "$(BUILDER_NAME)" \
            --driver remote \
            --platform linux/arm64 \
            tcp://$(arm64_vm_private_ip):1234

          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize selfhost Buildx Builder

    - ${{ if eq(parameters.buildType, 'cloud') }}:
      - bash: |
          set -e
          docker buildx rm "$(BUILDER_NAME)" 2>/dev/null || true
          docker buildx create --name "$(BUILDER_NAME)" --driver cloud "syncfusion/boldbi-cloud"
          docker buildx use "$(BUILDER_NAME)"
          docker buildx inspect --bootstrap
        displayName: Initialize cloud Buildx Builder

    #################################################
    # Build & Push Multi-Arch Images
    #################################################
    - bash: |
        set -e
        DEBIAN_IMAGE="$(REPOSITORY):${{ parameters.imageTag }}_$(Build.BuildId)"
        EVAL_IMAGE="$(REPOSITORY):${{ parameters.imageTag }}_$(Build.BuildId)_eval"
        IMAGES_TYPE="${{ parameters.imagesType }}"

        cd "$(extractPath)"

        echo "Images Type : $IMAGES_TYPE"

        if [ "$IMAGES_TYPE" = "debian" ] || [ "$IMAGES_TYPE" = "both" ]; then
          echo "Building Debian Image : $DEBIAN_IMAGE"
          docker buildx build \
            --builder "$(BUILDER_NAME)" \
            --platform linux/amd64,linux/arm64 \
            -t "$DEBIAN_IMAGE" \
            -f boldreports-manifest.txt \
            --push .
          echo "Debian Image Pushed Successfully"
        fi

        if [ "$IMAGES_TYPE" = "eval" ] || [ "$IMAGES_TYPE" = "both" ]; then
          echo "Building Eval Image : $EVAL_IMAGE"
          docker buildx build \
            --builder "$(BUILDER_NAME)" \
            --platform linux/amd64,linux/arm64 \
            -t "$EVAL_IMAGE" \
            --build-arg INSTALL_POSTGRES=true \
            -f boldreports-manifest.txt \
            --push .
          echo "Eval Image Pushed Successfully"
        fi
      displayName: Buildx Multi-Arch Build

    #################################################
    # Verify Multi-Arch Images
    #################################################
    - bash: |
        TAG="${{ parameters.imageTag }}_$(Build.BuildId)"
        IMAGES_TYPE="${{ parameters.imagesType }}"
        check() {
          OUT=$(docker buildx imagetools inspect "$1")
          echo "$OUT" | grep -q "linux/amd64" && echo "$OUT" | grep -q "linux/arm64" \
            && echo "OK multi-arch: $1" \
            || { echo "Missing architecture for $1"; exit 1; }
        }
        if [ "$IMAGES_TYPE" = "debian" ] || [ "$IMAGES_TYPE" = "both" ]; then
          check "$(REPOSITORY):${TAG}"
        fi
        if [ "$IMAGES_TYPE" = "eval" ] || [ "$IMAGES_TYPE" = "both" ]; then
          check "$(REPOSITORY):${TAG}_eval"
        fi
      displayName: Verify Multi-Arch Images

    #################################################
    # Cleanup (always)
    #################################################
    - bash: |
        docker buildx rm "$(BUILDER_NAME)" || true
        docker rm -f buildkit-amd64 || true
        docker system prune -f || true
      displayName: Cleanup Docker
      condition: always()

    - ${{ if eq(parameters.buildType, 'selfhost') }}:
      - task: AzureCLI@2
        displayName: Delete this run's ARM64 VM
        condition: always()
        inputs:
          azureSubscription: $(AZ_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            az vm delete -g "$(ARM_RG)" -n "$(ARM_VM_NAME)" --yes --force-deletion true || true
            echo "Deleted $(ARM_VM_NAME)"
